<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valley Life — Sunhollow Valley</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container"></div>

  <div id="ui">
    <!-- Top HUD -->
    <div id="hud-top">
      <div class="hud-panel hud-left">
        <div class="hud-row">
          <span id="hud-zone" class="zone-badge">Oakridge Farm</span>
          <span id="hud-weather" class="weather-badge">Sunny</span>
        </div>
        <div id="hud-date" class="hud-date">Mon, Day 1 · Spring</div>
        <div class="hud-row">
          <span id="hud-clock">6:00 AM</span>
          <span id="hud-quest-mini" class="quest-mini">No active quest</span>
        </div>
      </div>

      <div class="hud-panel hud-right">
        <div class="hud-row">
          <span id="hud-gold" class="gold-text">500 G</span>
          <span id="hud-resources" class="res-text">Wood: 60 · Stone: 40</span>
        </div>
        <div class="bar-row">
          <span class="bar-label">EN</span>
          <div class="bar-track"><div id="energy-bar-fill" class="bar-fill energy"></div></div>
          <span id="energy-bar-text" class="bar-val">100/100</span>
        </div>
        <div id="hp-bar-row" class="bar-row" style="display:none;">
          <span class="bar-label">HP</span>
          <div class="bar-track"><div id="hp-bar-fill" class="bar-fill hp"></div></div>
          <span id="hp-bar-text" class="bar-val">100/100</span>
        </div>
        <div class="hud-nav">
          <button data-open-modal="inventory" title="Inventory [I]">Bag</button>
          <button data-open-modal="shops" title="Town Shops & Mine">Shops</button>
          <button data-open-modal="shipping" title="Shipping Bin">Ship</button>
          <button data-open-modal="social" title="Villagers [P]">Social</button>
          <button data-open-modal="quests" title="Quests & Calendar [Q]">Journal</button>
          <button data-open-modal="bundles" title="Willowbrook Hall [B]">Hall</button>
          <button data-open-modal="skills" title="Skills [K]">Skills</button>
          <button id="btn-hud-sleep" title="Sleep / Next Day [N]">Sleep</button>
          <button data-open-modal="pause" title="Save / Load / Menu [Esc]">Menu</button>
        </div>
      </div>
    </div>

    <!-- Notification Toasts -->
    <div id="toast-container"></div>

    <!-- NPC Typewriter Dialogue Box -->
    <div id="dialogue-box" style="display:none;">
      <div class="dialogue-header">
        <strong id="dialogue-speaker">Villager</strong>
        <button id="dialogue-close" class="btn-xs">Continue</button>
      </div>
      <p id="dialogue-text"></p>
    </div>

    <!-- 10-Slot Bottom Hotbar -->
    <div id="hotbar"></div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" style="display:none;">
      <div id="modal-card">
        <div class="modal-header">
          <h2 id="modal-title">Menu</h2>
          <button id="modal-close" aria-label="Close">✕</button>
        </div>
        <div id="modal-body"></div>
      </div>
    </div>
  </div>

  <div id="message" style="display:none;"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="js/game.js"></script>
  <script type="module" src="js/ui.js"></script>
</body>
</html>
